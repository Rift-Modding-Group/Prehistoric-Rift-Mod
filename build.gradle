plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.cleanroommc.cleanroomgradle'
    id 'net.kyori.blossom' version '2.2.0'
}

import org.jetbrains.gradle.ext.Gradle
import net.minecraftforge.renamer.gradle.RenameJar
import net.minecraftforge.renamer.gradle.RenamerExtension

ext {
    //noinspection GroovyAssignabilityCheck
    access_transformer_locations = "${mod_id}_at.cfg"
}

version = mod_version
group = root_package

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    if (generate_sources_jar.toBoolean()) {
        withSourcesJar()
    }
    if (generate_javadocs_jar.toBoolean()) {
        withJavadocJar()
    }
}

configurations {
    contain
    implementation.extendsFrom(contain)
}

String apiPackagePath = "${root_package.replace('.', '/')}/api/**"
def apiSourceFiles = fileTree('src/main/java') {
    include(apiPackagePath)
}

def compileApiJavaTask = tasks.register('compileApiJava', JavaCompile) {
    group = 'build'
    description = 'Compiles only the public addon API.'
    source(apiSourceFiles)
    classpath = sourceSets.main.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('classes/java/api')
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

def apiDevJarTask = tasks.register('apiDevJar', Jar) {
    group = 'build'
    description = 'Assembles the development (MCP-named) addon API jar.'
    archiveClassifier = 'api-dev'
    from(compileApiJavaTask.flatMap { it.destinationDirectory })
    dependsOn(compileApiJavaTask)
}

def apiSourcesJarTask = tasks.register('apiSourcesJar', Jar) {
    group = 'build'
    description = 'Assembles the addon API sources jar.'
    archiveClassifier = 'api-sources'
    from(apiSourceFiles)
}

dependencies {
    implementation cleanroom.userdev(cleanroom_version) {
        if (use_access_transformer.toBoolean()) {
            accessTransformers.from(access_transformer_locations.tokenize().collect { "src/main/resources/META-INF/$it" })
        }
    }
}

cleanroom {
    runs {
        client {
            configure {
                username = minecraft_username
                jvmArgs extra_jvm_args.tokenize()
            }
        }
        server {
            configure {
                jvmArgs extra_jvm_args.tokenize()
            }
        }
    }
}

// CleanroomGradle supplies the mappings and compile classpath for reobfuscation.
def apiJarTask = tasks.register('apiJar', RenameJar, extensions.getByType(RenamerExtension))
apiJarTask.configure {
    group = 'build'
    description = 'Remaps the addon API jar for use outside a development environment.'
    from(apiDevJarTask)
    archiveClassifier = 'api'
    map.from(tasks.named('extractUserdevMcpToSrg').flatMap { it.output })
    libraries.from(sourceSets.main.compileClasspath)
}

tasks.register('buildApi') {
    group = 'build'
    description = 'Builds only the addon API binary and sources jars.'
    dependsOn(apiJarTask, apiSourcesJarTask)
}

dependencies {
    if (use_asset_mover.toBoolean()) {
        implementation "com.cleanroommc:assetmover:${asset_mover_version}"
    }
    if (enable_junit_testing.toBoolean()) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst {
        workingDir.mkdirs()
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

sourceSets {
    main {
        blossom {
            javaSources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('package', "${root_package}.${mod_id}")
            }
            resources {
                property('mod_id', mod_id)
                property('mod_name', mod_name)
                property('mod_version', mod_version)
                property('mod_description', mod_description)
                property('mod_authors', mod_authors.toString().split(',').findAll { !it.isBlank() }.collect { "\"${it.strip()}\"" }.join(', '))
                property('mod_credits', mod_credits)
                property('mod_url', mod_url)
                property('mod_update_json', mod_update_json)
                property('mod_logo_path', mod_logo_path)
                property('mod_issue_tracker', mod_issue_tracker)
            }
        }
    }
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Build'(Gradle) {
                    taskNames = ["build"]
                }
                '2. Run Client'(Gradle) {
                    taskNames = ["runClient"]
                }
                '3. Run Server'(Gradle) {
                    taskNames = ["runServer"]
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { "\"${it}\"" }.join(' ')
                    ]
                }
            }
            taskTriggers {
                beforeSync tasks.named("prepareDeobf")
            }
        }
    }
}

if (!enable_shadow.toBoolean()) {
    shadowJar.enabled = false
}

compileJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into('/') {
        from configurations.contain
    }
    doFirst {
        manifest {
            def attribute_map = [:]
            attribute_map['ModType'] = "CRL"
            attribute_map['MixinConfigs'] = "${mod_id}.mixin.json"
            if (configurations.contain.size() > 0) {
                attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
                attribute_map['NonModDeps'] = true
            }
            if (is_coremod.toBoolean()) {
                attribute_map['FMLCorePlugin'] = coremod_plugin_class_name
                if (coremod_includes_mod.toBoolean()) {
                    attribute_map['FMLCorePluginContainsFMLMod'] = true
                    attribute_map['ForceLoadAsMod'] = true
                }
            }
            if (use_access_transformer.toBoolean()) {
                attribute_map['FMLAT'] = access_transformer_locations
            }
            attributes(attribute_map)
        }
    }
}


if (enable_shadow.toBoolean()) {
    tasks.named('reobfJar', RenameJar) {
        from(tasks.named('shadowJar'))
    }
}

shadowJar {
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility
    configurations = [project.configurations.shadow]
    archiveClassifier = "shadow"
}

compileTestJava {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    })
    if (show_testing_output.toBoolean()) {
        testLogging {
            showStandardStreams = true
        }
    }
}

// Required by Foundation when launching through JavaExec, as in the template.
tasks.withType(JavaExec).configureEach {
    systemProperty 'foundation.loadsall', 'true'
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    systemProperty 'crl.dev.mixin', "${mod_id}.mixin.json"
    if (enable_foundation_debug.toBoolean()) {
        systemProperty 'foundation.dump', 'true'
        systemProperty 'foundation.verbose', 'true'
    }
    if (is_coremod.toBoolean()) {
        systemProperty 'fml.coreMods.load', coremod_plugin_class_name
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'
